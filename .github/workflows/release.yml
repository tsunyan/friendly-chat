name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      ASSET: friendly-chat-${{ github.ref_name }}.skill
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches metadata.version
        run: |
          version=$(sed -n 's/^  version: "\(.*\)"$/\1/p' skills/friendly-chat/SKILL.md)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match metadata.version (${version}) in SKILL.md"
            exit 1
          fi

      - name: Build the .skill file
        # A .skill file is a ZIP archive. claude.ai expects the skill folder itself at its top level.
        working-directory: skills
        run: |
          zip -r -X "$RUNNER_TEMP/$ASSET" friendly-chat
          unzip -l "$RUNNER_TEMP/$ASSET"

      - name: Read the release notes from the tag message
        # Read the annotation through the API: actions/checkout may turn annotated tags into lightweight ones.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is not an annotated tag. Write the release notes in the tag message (git tag -a)."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message \
            | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release, or update it on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" --repo "$GITHUB_REPOSITORY" \
              --title "friendly-chat $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
